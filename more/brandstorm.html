<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InCube Challenge</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">
    <link href="../css/aos.css?ver=1.1.0" rel="stylesheet">
    <link href="../css/bootstrap.min.css?ver=1.1.0" rel="stylesheet">
    <link href="../css/main.css?ver=1.1.0" rel="stylesheet">
    <link rel="shortcut icon" type="image/flower-icon" href="favicon.ico">
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css">
  </head>
<body>
<div class="profile-page">
  <div class="wrapper">
    <div class="page-header page-header-small" filter-color="blue">
      <div class="page-header-image" data-parallax="true" style="background-image: url('../images/brandstorm_cover.png')"></div>
      <div class="container">
        <div class="content-center">       
          <p class="category text-white" style="text-transform: none;font-size: 3em;">L'OREAL Brandstorm Challenge</p>
          <p class="category text-white" style="text-transform: none;font-size: 1.5em;">Top 2 of Mainland China Tech Track</p>
        </div>
      </div>
    </div>
  </div>
</div>


<div class="section" id="ppt-slides">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="h4 text-center mb-4 title">Our Pitch</div>
      </div>
    </div>
    <div class="row justify-content-center" style="width: 80%; margin: 0 auto;">
      <div class="ppt-slider">
        <button class="slide-btn prev-slide">&lt;</button>
        <div class="slides">
          <img src="../images/brandstorm_pitch1.png" alt="Slide 1">
          <img src="../images/brandstorm_pitch2.png" alt="Slide 2">
          <img src="../images/brandstorm_pitch3.png" alt="Slide 3">
          <img src="../images/brandstorm_pitch4.png" alt="Slide 4">
          <img src="../images/brandstorm_pitch5.png" alt="Slide 5">
          <img src="../images/brandstorm_pitch6.png" alt="Slide 6">
          <img src="../images/brandstorm_pitch7.png" alt="Slide 7">
          <img src="../images/brandstorm_pitch8.png" alt="Slide 8">
          <img src="../images/brandstorm_pitch9.png" alt="Slide 9">
          <img src="../images/brandstorm_pitch10.png" alt="Slide 10">
        </div>
        <button class="slide-btn next-slide">&gt;</button>
      </div>
    </div>
    <p class="text-center mt-4"><b>Use the arrows to navigate through the slides</b></p>
  </div>
</div>


<div class="section" id="ReadMore">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="h4 text-center mb-4 title">Read More</div>
      </div>
    </div>
    <div class="row justify-content-center" style="width: 80%; margin: 0 auto;">
      <div class="tab-content gallery mt-5">
        <div class="tab-pane active" id="ReadMore">
          <div class="ml-auto mr-auto">
            <div class="row" style="margin-bottom: 30px;">
              <div class="cc-porfolio-image img-raised" data-aos-anchor-placement="top-bottom">
                <a href="https://brandstorm.loreal.com/">
                  <figure class="cc-effect" style="margin: 0; display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;">
                    <img src="../images/brandstorm_cover.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center;">
                    <figcaption>
                      <div class="h4">Offcial Website</div>
                    </figcaption>
                  </figure>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<footer class="footer">
  <div class="h4 title text-center">Jiaxu Feng</div>
  <div class="text-center">
    <a href="../index.html" class="btn btn-primary btn-round btn-lg">Back to Home</a>
</footer>
<script src="../js/core/jquery.3.2.1.min.js?ver=1.1.0"></script>
<script src="../js/core/popper.min.js?ver=1.1.0"></script>
<script src="../js/core/bootstrap.min.js?ver=1.1.0"></script>
<script src="../js/now-ui-kit.js?ver=1.1.0"></script>
<script src="../js/aos.js?ver=1.1.0"></script>
<script src="../scripts/main.js?ver=1.1.0"></script>
</body>
</html>

</body>
</html>
